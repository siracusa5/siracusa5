<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
  <title id="title">Project atlas</title>
  <desc id="desc">Seven projects arranged on three connected vertical tracks: portable AI, live products, and web systems.</desc>
  <style>
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
