    .muted { fill: #59636e; }
    .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.35px; }
    .name { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .detail { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .meta { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .25px; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
    }
  </style>

